<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resident Feedback</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f1f3f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    /* CARD CONTAINER */
    .feedback-card {
      background: #fff;
      border-left: 6px solid #00b894;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 100%; max-width: 600px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-height: calc(100vh - 20px);
    }

    /* HEADER */
    .feedback-header {
      background-color: #00b894;
      padding: 20px;
      text-align: center;
    }
    .feedback-header h2 {
      color: #fff;
      font-size: 1.5rem;
      font-weight: 600;
    }

    /* FORM BODY */
    form.feedback-form {
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 16px 20px;
      overflow-y: auto;
    }
    form.feedback-form .full {
      grid-column: 1 / -1;
    }
    .feedback-form label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      color: #34495e;
      font-size: 0.95rem;
    }
    .feedback-form input,
    .feedback-form select,
    .feedback-form textarea {
      width: 100%; padding: 8px 10px;
      border: 1px solid #dfe6e9;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    .feedback-form input:focus,
    .feedback-form select:focus,
    .feedback-form textarea:focus {
      outline: none;
      border-color: #00b894;
    }

    /* FOOTER */
    .feedback-footer {
      padding: 16px 20px;
      background: #fafafa;
      text-align: center;
    }
    .feedback-footer button {
      background: #00b894;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .feedback-footer button:hover {
      background: #019875;
    }

    /* THANK YOU */
    .thank-you {
      padding: 20px;
      text-align: center;
      background: #eaf3f2;
      display: none;
      font-size: 1rem;
      color: #2d3436;
    }
    .thank-you a {
      color: #00b894;
      text-decoration: underline;
      display: block;
      margin-top: 8px;
      font-size: 0.95rem;
    }
    .thank-you .review-btn {
  display: inline-block;
  margin-top: 12px;
  padding: 10px 20px;
  background-color: #00b894;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 0.95rem;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.3s;
}
.thank-you .review-btn:hover {
  background-color: #019875;
}
  </style>
</head>
<body>
  <div class="feedback-card">
    <div class="feedback-header">
      <h2>Resident Feedback</h2>
    </div>

    <form class="feedback-form" id="reviewForm" onsubmit="return handleSubmit(event)">
    
      <div>
        <label for="name">Resident Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>
      <div>
        <label for="unit">Apartment No</label>
        <input type="text" id="unit" name="unit" placeholder="Unit No" required>
      </div>
      <div class="full">
        <label for="feedback">Comments</label>
        <textarea id="feedback" name="feedback" rows="3" placeholder="Share your thoughts..."></textarea>
      </div>

      <div class="full">
        <label for="maintenance">Maintenance Support</label>
        <select id="maintenance" name="maintenance" required>
          <option value="">Choose One</option>
          <option value="5">Excellent</option>
          <option value="4">Very Good</option>
          <option value="3">Good</option>
          <option value="2">Fair</option>
          <option value="1">Poor</option>
        </select>
      </div>

      <div class="full">
        <label for="leasing">Leasing Office Experience</label>
        <select id="leasing" name="leasing" required>
          <option value="">Choose One</option>
          <option value="5">Excellent</option>
          <option value="4">Very Good</option>
          <option value="3">Good</option>
          <option value="2">Fair</option>
          <option value="1">Poor</option>
        </select>
      </div>
      <div class="full">
        <label for="rating">Overall Experience</label>
        <select id="rating" name="rating" required>
          <option value="">Choose One</option>
          <option value="5">Excellent</option>
          <option value="4">Very Good</option>
          <option value="3">Good</option>
          <option value="2">Fair</option>
          <option value="1">Poor</option>
        </select>
      </div>
      <div class="feedback-footer full">
        <button type="submit">Submit Feedback</button>
      </div>
    </form>

    <div id="thankYou" class="thank-you"></div>
  </div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      const form = document.getElementById('reviewForm');
      const thankYou = document.getElementById('thankYou');
      const data = {
        name: form.name.value,
        unit: form.unit.value,
        feedback: form.feedback.value,
        maintenance: form.maintenance.value,
        leasing: form.leasing.value,
        rating: form.rating.value
      };

      form.style.display = 'none';


      if (parseInt(data.rating) >= 3) {
        thankYou.innerHTML = `
        Thank you for your feedback — we're glad you had a great experience!  
Would you mind taking a moment to share your experience on Google?  
<button class="review-btn" onclick="window.open('https://www.google.com/search?sca_esv=1740ddc3d2160827&sxsrf=AHTn8zohSYBCvo90eRp9Y9YDRRRnycnAMg:1746126650207&si=APYL9btvhO6SAb8jF9HqTZMMa7vs_teLnZaEVrJZwRKFIIKjoeYPsIIFH3_lMTngUTGtioCCO_nDXV4lmH5aBEfr6Kz1YaghbdifKJShb7V8fx0GaMtcqhP9QF-43La2mAhJvUydWjpK&q=The+Midway+Reviews&sa=X&ved=2ahUKEwjt0t7V_IKNAxXg38kDHT4PPSQQ0bkNegQIMhAE&biw=1440&bih=727&dpr=2#lrd=0x864f841df71262eb:0xaf9139e2a32499db,3,,,,', '_blank')">
      Leave a Google Review 
    </button>`;
      } else {
        thankYou.innerHTML = `
        We’re sorry to hear that your experience didn’t meet expectations.  
Your feedback is truly appreciated and will help us improve moving forward.  
Thank you for taking the time to share your thoughts.`;
      }
      thankYou.style.display = 'block';

      const payload = encodeURIComponent(JSON.stringify(data));
      fetch('https://script.google.com/macros/s/AKfycbzPs5G6VPiiSL1XEztjB0dQYk5ExriUwUgp9Wz-EJkvsJBgw0_yDBXeYTiE_ItGe56y/exec', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + payload
      });

      return false;
    }
  </script>
</body>
</html>
